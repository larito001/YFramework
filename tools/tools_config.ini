[path]
# Excel 配置表根目录（内含 3xlsx/ 子目录）；与生成脚本同在 tools/ 下
config_dir = excel

# Unity 客户端工程目录 (Assets/)
client_dir = ../client/Assets

# Proto 文件输出目录
proto_dir = _publish/proto

# Proto 编译 C# 输出目录
cs_proto_dir = ../client/Assets/ScriptGenerated/Proto

# protoc 编译器路径
protoc = 3rdparty/protobuf/protoc.exe

[publish]
# 跳过的文件名（逗号分隔）
skip_files = _配置说明.xlsx
