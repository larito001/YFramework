pluginManagement {
    repositories {
        // 国内镜像优先:绕开 dl.google.com 超时(AGP / gradle 插件)。命中不了再走下面官方源兜底。
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        **ARTIFACTORYREPOSITORY**
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

include ':launcher', ':unityLibrary'
**INCLUDES**

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        // 国内镜像优先:绕开 dl.google.com / repo1 超时(androidx、okhttp、glide、taptap aar 等依赖)。
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        **ARTIFACTORYREPOSITORY**
        google()
        mavenCentral()
// Android Resolver Repos Start
        def unityProjectPath = $/file:///**DIR_UNITYPROJECT**/$.replace("\\", "/")
        maven {
            url "https://repo.maven.apache.org/maven2" // Packages/com.taptap.sdk.cloudsave/Mobile/Editor/NativeDependencies.xml:6, Packages/com.taptap.sdk.core/Mobile/Editor/NativeDependencies.xml:6, Packages/com.taptap.sdk.leaderboard/Mobile/Editor/NativeDependencies.xml:6, Packages/com.taptap.sdk.login/Mobile/Editor/NativeDependencies.xml:6, Assets/DirichletAd/Editor/DirichletAdDependencies.xml:46, Assets/DirichletAd/Editor/DirichletAdDependencies.xml:52
        }
        maven {
            url "https://maven.google.com" // Assets/DirichletAd/Editor/DirichletAdDependencies.xml:21, Assets/DirichletAd/Editor/DirichletAdDependencies.xml:27, Assets/DirichletAd/Editor/DirichletAdDependencies.xml:33, Assets/DirichletAd/Editor/DirichletAdDependencies.xml:39
        }
        mavenLocal()
// Android Resolver Repos End
        flatDir {
            dirs "${project(':unityLibrary').projectDir}/libs"
        }
    }
}
